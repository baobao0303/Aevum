version: '1'

projects:
  - name: aevum
    environments:
      - name: production
        services:
          - type: web
            name: aevum
            runtime: docker
            plan: standard
            # The Dockerfile adds a start script to ghcr.io/aevum/aevum:stable. It runs migrations and the server
            dockerfilePath: ./.render/Dockerfile
            dockerContext: ./.render
            healthCheckPath: /info
            disk:
              # Uploaded blobs (~/.aevum/storage) and the generated private key
              # (~/.aevum/config/private.key) must survive restarts.
              name: aevum-data
              mountPath: /root/.aevum
              sizeGB: 10
            envVars:
              - key: AFFINE_SERVER_PORT
                value: 10000
              - key: AFFINE_SERVER_HTTPS
                value: true
              - key: DATABASE_URL
                fromDatabase:
                  name: aevum-postgres
                  property: connectionString
              - key: REDIS_SERVER_HOST
                fromService:
                  name: aevum-keyvalue
                  type: keyvalue
                  property: host
              - key: REDIS_SERVER_PORT
                fromService:
                  name: aevum-keyvalue
                  type: keyvalue
                  property: port

          - type: keyvalue
            name: aevum-keyvalue
            plan: starter
            maxmemoryPolicy: noeviction
            ipAllowList: [] # internal connections only

        databases:
          - name: aevum-postgres
            plan: basic-256mb
            postgresMajorVersion: '16'
            ipAllowList: [] # internal connections only
