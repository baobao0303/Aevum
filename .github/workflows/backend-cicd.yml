name: Backend CI/CD

on:
  push:
    branches:
      - main
      - canary
      - master
    paths:
      - 'packages/backend/**'
      - 'packages/common/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'package.json'
      - 'yarn.lock'
      - '.nvmrc'
      - 'Dockerfile.backend'
      - 'docker-compose.backend.yml'
      - '.github/workflows/backend-cicd.yml'
  pull_request:
    branches:
      - main
      - canary
      - master
    paths:
      - 'packages/backend/**'
      - 'packages/common/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'package.json'
      - 'yarn.lock'
      - '.nvmrc'
      - 'Dockerfile.backend'
      - 'docker-compose.backend.yml'
      - '.github/workflows/backend-cicd.yml'
  workflow_dispatch:
    inputs:
      push_docker:
        description: 'Push Docker image to container registry'
        required: true
        type: boolean
        default: true
      docker_tag:
        description: 'Custom Docker tag (leave empty for auto branch/sha)'
        required: false
        type: string
        default: ''
      deploy_after_build:
        description: 'Trigger deployment after Docker build (requires DEPLOY_ENABLED=true)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-backend:
    name: Build Backend & Native Module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          targets: 'x86_64-unknown-linux-gnu'

      - name: Cache Cargo Crates
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/backend/native
          shared-key: backend-native-x86_64

      - name: Get Yarn Cache Directory
        id: yarn-cache-dir
        run: echo "dir=$(yarn config cacheFolder --json | jq -r .effective)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn Dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ${{ steps.yarn-cache-dir.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install Backend Dependencies
        run: yarn workspaces focus @aevum/server @aevum/server-native @types/affine__env
        env:
          HUSKY: '0'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          SENTRYCLI_SKIP_DOWNLOAD: '1'

      - name: Build Rust Native Module
        run: |
          yarn workspace @aevum/server-native build --target x86_64-unknown-linux-gnu
          # Generate architecture aliases for Rspack static resolution
          cp ./packages/backend/native/server-native.node ./packages/backend/native/server-native.x64.node
          touch ./packages/backend/native/server-native.arm64.node
          touch ./packages/backend/native/server-native.armv7.node

      - name: Generate Prisma Client
        run: yarn workspace @aevum/server prisma generate

      - name: Build Backend Server
        run: yarn workspace @aevum/server build

      - name: Verify Compiled Output
        run: |
          echo "=== Backend Dist Contents ==="
          ls -lh packages/backend/server/dist
          test -f packages/backend/server/dist/main.js

      - name: Prepare Production Node Modules
        run: |
          yarn config set --json supportedArchitectures.cpu '["x64"]'
          yarn config set --json supportedArchitectures.libc '["glibc"]'
          yarn workspaces focus @aevum/server --production
          yarn workspace @aevum/server prisma generate
          mv ./node_modules ./packages/backend/server/node_modules

      - name: Upload Backend Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-package
          path: packages/backend/server
          retention-days: 1
          if-no-files-found: error

  docker-build-push:
    name: Build & Push Docker Image
    needs: build-backend
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push_docker == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download Backend Package Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-package
          path: packages/backend/server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub (Optional)
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/aevum-backend
          tags: |
            type=ref,event=branch
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/canary' }}
            type=raw,value=${{ inputs.docker_tag }},enable=${{ inputs.docker_tag != '' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish Workflow Summary
        run: |
          echo "### 🚀 Aevum Backend Image Published!" >> $GITHUB_STEP_SUMMARY
          echo "**Published Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run on server with Docker Compose:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "AEVUM_IMAGE=ghcr.io/${{ github.repository_owner }}/aevum-backend:latest docker compose -f docker-compose.backend.yml up -d" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to Server (CD)
    needs: docker-build-push
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/canary' || (github.event_name == 'workflow_dispatch' && inputs.deploy_after_build == true)) && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            echo "🚀 Deploying latest Aevum backend..."
            cd ${{ secrets.DEPLOY_PATH || '/opt/aevum' }}
            docker compose -f docker-compose.backend.yml pull aevum_server aevum_migration
            docker compose -f docker-compose.backend.yml up -d --remove-orphans
            echo "✅ Deployment completed successfully!"
