<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=<%= VIEWPORT_FIT %>"
    />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <title>Aevum</title>
    <meta name="theme-color" content="#fafafa" />
    <%= PRECONNECT %>
    <link rel="manifest" href="/manifest.json" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png?v=3"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32.png?v=3"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/favicon-192.png?v=3"
    />
    <link rel="shortcut icon" href="/favicon.ico?v=3" />
    <link rel="preload" as="image" href="/aevum-auth-bg.jpg?v=7" />
    <link
      rel="preload"
      as="video"
      href="/aevum-auth-bg.mp4?v=7"
      type="video/mp4"
    />
    <meta name="emotion-insertion-point" content="" />
    <meta property="description" content="<%= DESCRIPTION %>" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://aevum.io/" />
    <meta name="twitter:title" content="Aevum: The Timeless Workspace." />
    <meta name="twitter:description" content="<%= DESCRIPTION %>" />
    <meta name="twitter:site" content="@Aevum" />
    <meta name="twitter:image" content="https://aevum.io/og.jpeg" />
    <meta property="og:title" content="Aevum: The Timeless Workspace." />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="<%= DESCRIPTION %>" />
    <meta property="og:url" content="https://aevum.io/" />
    <meta property="og:image" content="https://aevum.io/og.jpeg" />
  </head>

  <body>
    <div id="app" data-version="<%= GIT_SHORT_SHA %>"></div>
  </body>
</html>
